    { name = "M A", email = "mshmnak80@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.13.4",
    "cryptography>=46.0.7",
    "langchain-community>=0.4.2",
    "langchain-core>=1.2.28",
    "langchain-openai>=1.1.14",
    "langchain-tavily>=0.2.18",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.2.12",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "langgraph-cli[inmem]>=0.4.32",
    "langgraph-prebuilt>=1.1.0",
    "langgraph-sdk>=0.4.5",
    "langsmith>=0.7.31",
    "notebook>=7.6.3",
    "pygments>=2.20.0",
    "trustcall>=0.0.39",
    "wikipedia>=1.4.0",
